<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Assalamu Alaikum wa Rahmatullahi wa Barakatuh. Welcome to WIEXORA.">
<title>Assalamu Alaikum - Welcome to WIEXORA</title>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8C6A2B"/><stop offset="0.5" stop-color="#F0CF88"/><stop offset="1" stop-color="#D8AD58"/>
  </linearGradient>
  <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF3D1"/><stop offset="0.55" stop-color="#F0CF88"/><stop offset="1" stop-color="#D8AD58"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D8AD58" stop-opacity="0"/><stop offset="0.5" stop-color="#D8AD58" stop-opacity="0.95"/><stop offset="1" stop-color="#D8AD58" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F0CF88" stop-opacity="0.85"/><stop offset="0.5" stop-color="#8C6A2B" stop-opacity="0.35"/><stop offset="1" stop-color="#D8AD58" stop-opacity="0.8"/>
  </linearGradient>

  <radialGradient id="wglow" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#2b210c" stop-opacity="0.9"/><stop offset="1" stop-color="#030303" stop-opacity="0"/></radialGradient>
  <mask id="wm"><text x="600" y="128" text-anchor="middle" font-family="'Inter','Manrope','Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="14" fill="#fff">WELCOME TO WIEXORA</text></mask>
  <clipPath id="wc"><rect width="1200" height="220" rx="16"/></clipPath>
</defs>
<g clip-path="url(#wc)">
  <rect width="1200" height="220" fill="#030303"/>
  <rect width="1200" height="220" fill="url(#wglow)"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#edge)"/>
  <rect x="0" y="218.5" width="1200" height="1.5" fill="url(#edge)"/>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="1.1s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.3s" dur="1.1s" fill="freeze"/>
    <text x="600" y="58" text-anchor="middle" font-family="'Inter','Manrope','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#D8AD58">ASSALAMU ALAIKUM WA RAHMATULLAHI WA BARAKATUH</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="1.3s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.1s" dur="1.3s" fill="freeze"/>
    <text x="600" y="128" text-anchor="middle" font-family="'Inter','Manrope','Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="14" fill="url(#goldv)">WELCOME TO WIEXORA</text>
    <rect x="-300" y="80" width="240" height="64" fill="url(#sheen)" mask="url(#wm)" opacity="0.8">
      <animate attributeName="x" from="-300" to="1300" dur="7s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="1.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="2.0s" dur="1.2s" fill="freeze"/>
    <text x="600" y="170" text-anchor="middle" font-family="'Inter','Manrope','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#AAA7A0">Thank you for visiting. I'm <tspan fill="#F7F1E5" font-weight="600">Md Sohag</tspan>, founder of WIEXORA.</text>
  </g>

  <line x1="600" y1="194" x2="600" y2="194" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round">
    <animate attributeName="x1" from="600" to="360" begin="2.4s" dur="1.4s" fill="freeze"/>
    <animate attributeName="x2" from="600" to="840" begin="2.4s" dur="1.4s" fill="freeze"/>
  </line>
  <g fill="#D8AD58">
    <polygon points="600,187 607,194 600,201 593,194"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></polygon>
    <polygon points="86,108 94,116 86,124 78,116" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></polygon>
    <polygon points="1114,108 1122,116 1114,124 1106,116" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></polygon>
  </g>
</g>
</svg>
